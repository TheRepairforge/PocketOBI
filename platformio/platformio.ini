; PlatformIO build for PocketOBI (alternative to the Arduino IDE).
;
; This is a conventional PlatformIO project (src/ + lib/). The firmware and the
; bundled OneWire2 library here are a MIRROR of the canonical Arduino sources at
; the repository root — see README.md in this folder and run sync.ps1 / sync.sh
; after editing the root PocketOBI.ino. The root PocketOBI.ino is the single
; source of truth.
;
; Board: generic ESP32-C3 (SuperMini). esp32-c3-devkitm-1 works for it; change
; `board` if you use a different ESP32-C3 module.

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; ESP32-C3 native USB serial. BOTH flags are required on the C3, otherwise
; `Serial` is undefined at compile time:
;   ARDUINO_USB_MODE=1        -> use the built-in USB Serial/JTAG (HWCDC)
;   ARDUINO_USB_CDC_ON_BOOT=1 -> map `Serial` to it (= Arduino IDE "USB CDC On Boot: Enabled")
; Needed for the serial monitor and the PC-bridge mode.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    mathertel/RotaryEncoder
; OneWire2 is bundled locally in lib/OneWire2/ and picked up automatically.
