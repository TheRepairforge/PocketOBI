; PlatformIO build for PocketOBI. Single source: compiles PocketOBI.ino and its
; siblings straight from the repo root (same files the Arduino IDE builds).
; No mirror, no sync script (see DECISIONS.md D14).
;
; One env per carrier board. Each env pins its board with -DPOCKETOBI_BOARD so
; the build is deterministic regardless of a local board_local.h (see
; board_config.h): the flag wins, the local file is only used by the Arduino IDE.
;   pio run -e esp32-c3   -> PocketOBI-LXT (shipping product, ESP32-C3 + encoder)
;   pio run -e cyd        -> CYD dev/alt target (ESP32-2432S028R + resistive touch)
;   pio run -e esp32-c3-asia / cyd-asia -> same boards, Asia build: EN + JA + KO + VI + ZH (DECISIONS.md D58, D60)
;   pio run -e es3c28p    -> ES3C28P third carrier (ESP32-S3 + ILI9341V + FT6336G touch, D48)
[platformio]
src_dir = .

; Shared across every board. Board-specific pins live in board_config.h, not here.
[env]
; Pinned: every release so far was built on 7.1.3 (Arduino core 2.0.17). An unpinned platform
; let a fresh machine or the CI pick up 8.0.0 (core 3.3.x), a different firmware. Move on purpose.
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    mathertel/RotaryEncoder

; --- Shipping product: ESP32-C3 SuperMini + ST7789 + EC11 encoder ---
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D POCKETOBI_BOARD=BOARD_LXT_C3

; --- Dev/alt: "Cheap Yellow Display" ESP32-2432S028R + XPT2046 resistive touch ---
; Generic ESP32-WROOM board profile; the CYD carries no encoder (touch only), but
; RotaryEncoder is a harmless shared dependency (its object is compiled out by the
; BOARD_HAS_ENCODER capability flag).
[env:cyd]
board = esp32dev
build_flags =
    -D POCKETOBI_BOARD=BOARD_CYD
lib_deps =
    ${env.lib_deps}
    ; Pinned to v1.4 (the version installed in the Arduino IDE): it has the
    ; begin(SPIClass&) overload the sketch uses for the touch's own SPI bus.
    ; The PlatformIO registry serves a broken 0.0.0-alpha snapshot that lacks it,
    ; so pull the tagged release from source instead — keeps both toolchains
    ; on the same library version.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

; --- Asia builds (DECISIONS.md D58, D60): <board-env>-asia = the base env with EN + Japanese + Korean
; + Vietnamese, FR/DE/ES not offered (ENABLE_CJK=1, ENABLE_EU=0, ENABLE_VI=1). The base envs above stay the shipping
; EN/FR/DE/ES firmware, with no CJK code in them.
[env:esp32-c3-asia]
extends = env:esp32-c3
build_flags =
    ${env:esp32-c3.build_flags}
    -D ENABLE_CJK=1
    -D ENABLE_EU=0
    -D ENABLE_VI=1

[env:cyd-asia]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -D ENABLE_CJK=1
    -D ENABLE_EU=0
    -D ENABLE_VI=1

; --- Screen demo for UI review (demo.h): fictional packs, every screen, no pack I/O, no bridge. ---
; Not a shipping firmware. Every language (ENABLE_CJK=1, ENABLE_EU=1, ENABLE_VI=1).
; C3: turn = screen, click / Back = next / previous pack, Back long = language.
; CYD: tap left / right = screen, title bar = next pack, footer = language.
[env:esp32-c3-demo]
extends = env:esp32-c3
build_flags =
    ${env:esp32-c3.build_flags}
    -D ENABLE_CJK=1
    -D ENABLE_VI=1
    -D UI_DEMO=1

[env:cyd-demo]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -D ENABLE_CJK=1
    -D ENABLE_VI=1
    -D UI_DEMO=1

; --- CYD variant fitted with an ILI9341 panel instead of the ST7789 (mirrored image,
;     red/blue swapped on the plain cyd build). Same board, ILI9341 orientation. ---
[env:cyd-ili9341]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -D CYD_ILI9341=1

; --- Third carrier: ES3C28P (LCDWiki), ESP32-S3 + ILI9341V + FT6336G capacitive touch (D48).
;     Community-tested, not bench-validated by us. Native USB on the Type-C, so the CDC-on-boot
;     flags route the serial log and the PC bridge to it. Uses the shared lib_deps only (no
;     XPT2046: the FT6336 driver is header-only, touch_ft6336.h). ---
[env:es3c28p]
board = esp32-s3-devkitc-1
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D POCKETOBI_BOARD=BOARD_ES3C28P
    -D ENABLE_VI=1
